[package]
name = "openpacketlab"
version = "0.1.0"
description = "Open-source network simulator and teaching lab"
authors = ["OpenPacketLab contributors"]
license = "Apache-2.0"
repository = "https://github.com/Lin8x/OpenPacketLab"
edition = "2021"
rust-version = "1.77"

[lib]
name = "openpacketlab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keep the binary small: the UI is plain web assets, the Rust side is a thin shell.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
