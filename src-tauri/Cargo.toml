[package]
name = "openpacketlab"
version = "0.1.0"
description = "Open-source network simulator and teaching lab"
authors = ["OpenPacketLab contributors"]
license = "Apache-2.0"
repository = "https://github.com/Lin8x/OpenPacketLab"
edition = "2021"
rust-version = "1.85"

[lib]
name = "openpacketlab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-opener = "2"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "4.0.0"
suppaftp = { version = "6", features = ["rustls", "deprecated"] }
tokio = { version = "1.53.3", features = ["io-util", "net", "time"] }
dirs = "7.0.0"
webpki-roots = "1.0.12"

# Keep the binary small: the UI is plain web assets, the Rust side is a thin shell.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
