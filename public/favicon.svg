<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#3D8BFF"/>
      <stop offset="0.55" stop-color="#2F5BE7"/>
      <stop offset="1" stop-color="#5B2BD6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#8FE3FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8FE3FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="node" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#E8F0FF"/>
      <stop offset="1" stop-color="#B9CCF5"/>
    </radialGradient>
    <radialGradient id="core" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#DDF6FF"/>
      <stop offset="1" stop-color="#8ED4F7"/>
    </radialGradient>
    <linearGradient id="packet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#FF8A1F"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B1A5C" flood-opacity="0.35"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="packetGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="squircle">
      <path d="M512 100c215 0 300 0 356 56s56 141 56 356 0 300-56 356-141 56-356 56-300 0-356-56-56-141-56-356 0-300 56-356 141-56 356-56z"/>
    </clipPath>
  </defs>

  <g >
    <g clip-path="url(#squircle)">
      <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
      <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
            <rect x="100" y="100" width="824" height="420" fill="url(#sheen)"/>
    </g>
  </g>

  <!-- links -->
  <g stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" stroke-opacity="0.92" filter="url(#shadow)">
    <path d="M512 520L512 298"/>
    <path d="M512 520L310 640"/>
    <path d="M512 520L714 640"/>
  </g>

  <!-- outer nodes -->
  <g filter="url(#shadow)">
    <circle cx="512" cy="290" r="88" fill="url(#node)"/>
    <circle cx="300" cy="650" r="88" fill="url(#node)"/>
    <circle cx="724" cy="650" r="88" fill="url(#node)"/>
  </g>
  
  <!-- core node -->
  <g filter="url(#shadow)">
    <circle cx="512" cy="520" r="120" fill="url(#core)"/>
  </g>
  
  <circle cx="512" cy="520" r="44" fill="#2F5BE7"/>

  <!-- packet in flight -->
  <g filter="url(#packetGlow)" transform="rotate(-31 611 580)">
    <rect x="575" y="553" width="72" height="54" rx="12" fill="url(#packet)"/>
    <path d="M584 566l27 20 27-20" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
